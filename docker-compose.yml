services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"          # host 5433 -> avoids clash with a local PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs ONLY on an empty volume, in alphabetical order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: radifmfz/eventlokal-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      - "8000:8000"
    # Note: Mount volume - ./backend:/app ditiadakan agar kompatibel penuh baik untuk:
    # Opsi A (docker compose up --build) maupun Opsi B (docker compose up dari image Docker Hub).
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    image: radifmfz/eventlokal-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend

  mailpit:                    # fake SMTP server for demo/testing: inbox UI at http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
